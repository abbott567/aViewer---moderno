<!doctype html>
<meta charset="utf-8">
<title>ARIA state probe</title>
<body>
  <button id="p1" aria-pressed="true">Pressed true</button>
  <button id="p2" aria-pressed="false">Pressed false</button>
  <button id="e1" aria-expanded="true">Expanded true</button>
  <div id="c1" role="checkbox" aria-checked="mixed" tabindex="0">Checked mixed</div>
  <a id="cur" href="#" aria-current="page">Current page</a>
  <button id="d1" aria-disabled="true">Disabled</button>
  <input id="i1" aria-invalid="true" aria-required="true" value="invalid">
</body>
